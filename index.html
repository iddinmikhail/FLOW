<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FLOW — Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet" />
</head>
<body>

<nav class="icon-sidebar">
    <img src="images/logo-flow.png" alt="FLOW" class="sidebar-logo" />
    <a href="index.html" class="active" title="Dashboard"><img src="images/icon-desk.png" alt="Dashboard" /></a>
    <a href="quest.html" title="Quest Board"><img src="images/icon-checklist.png" alt="Quest Board" /></a>
    <a href="submissions.html" title="Submissions"><img src="images/icon-thumbsup.png" alt="Submissions" /></a>
    <a href="teacher.html" title="Advisor"><img src="images/icon-gear.png" alt="Advisor" /></a>
    <div class="sidebar-spacer"></div>
</nav>

<div class="dash-shell">

    <!-- ============ LEFT: FLOW RANK ============ -->
    <aside class="rank-card">
        <div class="rank-visual">
            <svg class="rank-curve-text" viewBox="0 0 360 360" aria-hidden="true">
                <path id="healthyArc" d="M 64.3 42.1 A 180 180 0 0 1 349.1 118.4" fill="none" />
                <text><textPath href="#healthyArc" startOffset="0">Stay healthy!</textPath></text>
            </svg>
            <img src="images/mascot-awan.png" alt="Flow mascot" class="rank-mascot-bg" />
            <img src="images/ring-track.png" alt="" class="rank-ring rank-ring-track" />
            <img src="images/ring-fill.png" alt="" class="rank-ring rank-ring-fill" id="ringFill" />
            <svg class="rank-heart" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21s-6.7-4.3-9.4-8.2C.8 10.1 1.6 6.6 4.4 5.2c2.2-1.1 4.6-.4 6 1.3l1.6 1.9 1.6-1.9c1.4-1.7 3.8-2.4 6-1.3 2.8 1.4 3.6 4.9 1.8 7.6C18.7 16.7 12 21 12 21z" />
            </svg>
        </div>

        <h3 class="rank-heading">Flow Rank</h3>

        <div class="exp-row">
            <span class="mini-cloud" aria-hidden="true"></span>
            <span class="exp-row-label">Flow EXP <strong id="expLabel">52/100</strong></span>
        </div>
        <div class="exp-track">
            <img src="images/pill-track.png" alt="" class="pill-img pill-track-img" />
            <div class="pill-fill-wrap" id="pillFillWrap" style="width:52%">
                <img src="images/pill-fill.png" alt="" class="pill-img pill-fill-img" />
            </div>
        </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <main class="dash-main">

        <div class="greeting-row">
            <h1 id="greeting" class="page-header-lockup"><img src="images/logo-flow.png" alt="Flow" class="wordmark" /><span class="lockup-text">ing in, <strong>Daleesya</strong></span></h1>
            <span class="date-chip" id="todayChip"></span>
        </div>

        <div class="ongoing-highlight">
            <span class="tag">Ongoing Quest</span>
            <h2>Refine Project Management and Marketing and Collaboration Portfolio</h2>
            <p class="deadline" id="deadlineText"></p>
        </div>

        <div class="submission-rows" id="submissionRows"></div>

        <div class="daily-quest-section">
            <h3>Daily Quest</h3>
            <div class="daily-quest-grid" id="dailyQuestGrid"></div>
        </div>

    </main>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
